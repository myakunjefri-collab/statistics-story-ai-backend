
services:
  db:
    image: postgres:18
    container_name: statistics-story-ai-db
    environment:
      POSTGRES_DB: statistics_story_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped

  backend:
    build: .
    container_name: statistics-story-ai-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/statistics_story_ai
      FRONTEND_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data: